twig:
    form_themes:
        - '@FOSCKEditor/Form/ckeditor_widget.html.twig'

fos_ck_editor:
    base_path: "ckeditor"
    js_path: "ckeditor/ckeditor.js"
    default_config: bloc_config

    configs:
        bloc_config:
            language: fr
            height: 500
            clipboard_handleImages: false
            extraPlugins: "div"
            allowedContent: true
            format_tags: "p;h1;h2;h3;h4"

            contentsCss:
            - 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'
            - '/admin/ckeditor/dynamic-style.css'
            - '/css/ckeditor_editor_helpers.css'

            bodyClass: 'p-4 bg-white ckeditor-preview'

            toolbar:
            - [ 'Format' ]
            - [ 'Bold', 'Italic', 'Underline', 'RemoveFormat' ]
            - [ 'NumberedList', 'BulletedList', 'Outdent', 'Indent' ]
            - [ 'JustifyLeft', 'JustifyCenter', 'JustifyRight', 'JustifyBlock' ]
            - [ 'Link', 'Unlink', 'Image', 'Table', 'HorizontalRule', 'CreateDiv' ]
            - [ 'Undo', 'Redo', 'Source', 'Maximize' ]

            
            extraAllowedContent: 'section(*){*}[*];div(*){*}[*];header(*){*}[*];footer(*){*}[*];main(*){*}[*];article(*){*}[*];span(*){*}[*];a[*]{*}(*);img[*]{*}(*);table(*){*}[*];thead[*]{*}(*);tbody[*]{*}(*);tr[*]{*}(*);th[*]{*}(*);td[*]{*}(*);button[*]{*}(*);i(*){*}[*]'

            filebrowserUploadRoute: admin_bloc_upload_image
            filebrowserImageUploadRoute: admin_bloc_upload_image
            filebrowserImageBrowseRoute: admin_media_browser
            filebrowserUploadMethod: form